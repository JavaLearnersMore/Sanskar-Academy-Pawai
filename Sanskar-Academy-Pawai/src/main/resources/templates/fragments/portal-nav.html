<!-- Role based menu for Teacher / Student / Parent pages.
     Usage:  <div th:replace="~{fragments/portal-nav :: nav('dashboard')}"></div>  -->
<div th:fragment="nav(active)" class="portal-nav">
    <div class="nav-inner">

        <th:block sec:authorize="hasRole('TEACHER')">
            <a th:href="@{/teacher/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'">🏠 Dashboard</a>
            <a th:href="@{/teacher/attendance}" th:classappend="${active == 'attendance'} ? 'active'">✅ Attendance</a>
            <a th:href="@{/teacher/exams}" th:classappend="${active == 'exams'} ? 'active'">🧠 Exams</a>
            <a th:href="@{/teacher/exams/insights}" th:classappend="${active == 'insights'} ? 'active'">📊 Student Levels</a>
            <a th:href="@{/teacher/leave}" th:classappend="${active == 'leave'} ? 'active'">📝 Leave</a>
            <a th:href="@{/staff/dashboard}">🗓 My Attendance &amp; Salary</a>
        </th:block>

        <th:block sec:authorize="hasRole('STAFF')">
            <a th:href="@{/staff/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'">🏠 Dashboard</a>
            <a th:href="@{/staff/leave}" th:classappend="${active == 'leave'} ? 'active'">📝 Leave</a>
            <a th:href="@{/staff/salary}" th:classappend="${active == 'salary'} ? 'active'">💼 Salary</a>
            <a th:href="@{/account}">👤 My Account</a>
        </th:block>

        <th:block sec:authorize="hasRole('STUDENT')">
            <a th:href="@{/student/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'">🏠 Dashboard</a>
            <a th:href="@{/student/learn}" th:classappend="${active == 'learn'} ? 'active'">🤖 AI Learn</a>
            <a th:href="@{/student/exams}" th:classappend="${active == 'exams'} ? 'active'">🧠 Exams</a>
            <a th:href="@{/student/leave}" th:classappend="${active == 'leave'} ? 'active'">📝 Leave</a>
        </th:block>

        <th:block sec:authorize="hasRole('PARENT')">
            <a th:href="@{/parent/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'">🏠 Dashboard</a>
            <a th:href="@{/parent/fees}" th:classappend="${active == 'fees'} ? 'active'">💳 Pay Fees</a>
            <a th:href="@{/parent/results}" th:classappend="${active == 'results'} ? 'active'">🎓 Results</a>
            <a th:href="@{/parent/leave}" th:classappend="${active == 'leave'} ? 'active'">📝 Leave</a>
        </th:block>

    </div>
</div>
