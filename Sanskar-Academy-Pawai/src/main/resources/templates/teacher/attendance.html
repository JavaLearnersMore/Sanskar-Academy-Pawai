<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Attendance | Sanskar Academy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/portal.css}" rel="stylesheet">
</head>
<body class="portal-body">

<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/portal-nav :: nav('attendance')}"></div>

<div class="portal-wrap">

    <h3 class="mb-3">✅ Take Attendance</h3>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="soft-card mb-4"><div class="card-pad">
        <form th:action="@{/teacher/attendance}" method="get" class="row g-3 align-items-end">
            <div class="col-md-5">
                <label class="form-label">Subject / Class</label>
                <select name="subjectId" class="form-select" required>
                    <option value="">Select subject</option>
                    <option th:each="s : ${subjects}" th:value="${s.id}" th:selected="${s.id == subjectId}"
                            th:text="${s.subjectName} + ' - Class ' + ${s.classEntity.className}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Date</label>
                <input type="date" name="date" class="form-control" th:value="${date}" th:max="${today}">
            </div>
            <div class="col-md-2"><button class="btn btn-primary w-100">Load</button></div>
        </form>
    </div></div>

    <div class="soft-card" th:if="${subject != null}">
        <div class="card-title-row">
            <h5 th:text="${subject.subjectName} + ' - Class ' + ${subject.classEntity.className} + ' - ' + ${#temporals.format(date,'dd MMM yyyy')}"></h5>
            <div>
                <button type="button" class="btn btn-sm btn-outline-success" onclick="setAll('PRESENT')">All Present</button>
                <button type="button" class="btn btn-sm btn-outline-danger" onclick="setAll('ABSENT')">All Absent</button>
            </div>
        </div>
        <div class="card-pad">
            <form th:action="@{/teacher/attendance/save}" method="post">
                <input type="hidden" name="subjectId" th:value="${subject.id}">
                <input type="hidden" name="date" th:value="${date}">

                <div class="list-row" th:each="r : ${rows}">
                    <div class="d-flex align-items-center gap-3">
                        <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(r.studentName,0,1))}">S</span>
                        <div>
                            <div class="fw-semibold" th:text="${r.studentName}"></div>
                            <small class="text-muted" th:text="${r.email}"></small>
                            <span class="badge bg-info text-dark ms-1" th:if="${r.onLeave}">On approved leave</span>
                        </div>
                    </div>
                    <div class="btn-group" role="group">
                        <input type="radio" class="btn-check" th:name="'status_' + ${r.studentId}" th:id="'p' + ${r.studentId}"
                               value="PRESENT" th:checked="${r.status == 'PRESENT'}">
                        <label class="btn btn-outline-success btn-sm" th:for="'p' + ${r.studentId}">Present</label>
                        <input type="radio" class="btn-check" th:name="'status_' + ${r.studentId}" th:id="'a' + ${r.studentId}"
                               value="ABSENT" th:checked="${r.status == 'ABSENT'}">
                        <label class="btn btn-outline-danger btn-sm" th:for="'a' + ${r.studentId}">Absent</label>
                    </div>
                </div>

                <div class="empty-note" th:if="${#lists.isEmpty(rows)}">
                    No students are in this class yet. Ask the admin to add students to the class.
                </div>
                <button class="btn btn-primary mt-3" th:unless="${#lists.isEmpty(rows)}">💾 Save Attendance</button>
                <small class="text-muted d-block mt-2">Parents are notified automatically when a student is marked absent.</small>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script>
    function setAll(v) {
        document.querySelectorAll('input[type=radio][value=' + v + ']').forEach(function (r) { r.checked = true; });
    }
</script>
</body>
</html>
