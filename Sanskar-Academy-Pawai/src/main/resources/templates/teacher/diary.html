<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Class Diary | Sanskar Academy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/portal.css}" rel="stylesheet">
</head>
<body class="portal-body">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/portal-nav :: nav(diary)}"></div>
<div class="portal-wrap">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <h3 class="mb-3">&#128210; Class Diary</h3>
    <div th:if="${pick == null}" class="alert alert-info">You have no subjects yet.</div>
    <div th:if="${pick != null}" class="soft-card mb-3"><div class="card-pad">
        <form method="get" th:action="@{/teacher/diary}" class="row g-2 mb-3">
            <div class="col-md-6"><select name="subjectId" class="form-select" onchange="this.form.submit()">
                <option th:each="s : ${subjects}" th:value="${s.id}" th:selected="${s.id == pick.id}" th:text="${s.classEntity.className + ' - ' + s.subjectName}"></option>
            </select></div>
        </form>
        <form th:action="@{/teacher/diary}" method="post">
            <input type="hidden" name="subjectId" th:value="${pick.id}">
            <div class="row g-2">
                <div class="col-md-5">
                    <label class="form-label small">Students (tick one or more)</label>
                    <div class="border rounded p-2" style="max-height:220px;overflow:auto">
                        <div class="form-check" th:each="s : ${students}">
                            <input class="form-check-input" type="checkbox" name="studentIds" th:value="${s.id}" th:id="${'st' + s.id}">
                            <label class="form-check-label" th:for="${'st' + s.id}" th:text="${s.fullName}"></label>
                        </div>
                    </div>
                </div>
                <div class="col-md-7">
                    <label class="form-label small">Type</label>
                    <select name="category" class="form-select mb-2">
                        <option value="POSITIVE">Good work / praise</option>
                        <option value="CONCERN">Concern</option>
                        <option value="NOTE" selected>General note</option>
                    </select>
                    <label class="form-label small">Remark</label>
                    <textarea name="text" class="form-control mb-2" rows="3" maxlength="500" required></textarea>
                    <div class="form-check mb-2"><input class="form-check-input" type="checkbox" name="visible" value="true" id="vis" checked>
                        <label class="form-check-label" for="vis">Show to parents</label></div>
                    <button class="btn btn-primary">Save remark</button>
                </div>
            </div>
        </form>
    </div></div>
    <div class="soft-card"><div class="card-pad">
        <h5>My recent remarks</h5>
        <div th:if="${#lists.isEmpty(recent)}" class="text-muted">None yet.</div>
        <table class="table table-sm align-middle" th:unless="${#lists.isEmpty(recent)}">
            <tbody><tr th:each="e : ${recent}">
                <td class="text-nowrap" th:text="${#temporals.format(e.createdAt, 'dd MMM yyyy')}"></td>
                <td th:text="${e.student.fullName}"></td>
                <td><span class="badge" th:classappend="${e.category.name() == 'POSITIVE'} ? 'bg-success' : (${e.category.name() == 'CONCERN'} ? 'bg-danger' : 'bg-secondary')" th:text="${e.category}"></span></td>
                <td th:text="${e.text}"></td>
                <td><span th:if="${!e.visibleToParent}" class="badge bg-light text-dark border">hidden from parent</span></td>
                <td class="text-end"><form th:action="@{'/teacher/diary/' + ${e.id} + '/delete'}" method="post"><button class="btn btn-sm btn-outline-danger">&times;</button></form></td>
            </tr></tbody>
        </table>
    </div></div>

</div>
</body>
</html>
