<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Month | Sanskar Academy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/portal.css}" rel="stylesheet">
</head>
<body class="portal-body">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/portal-nav :: nav(mymonth)}"></div>
<div class="portal-wrap">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <h3 class="mb-3">&#128197; My Month</h3>
    <form method="get" th:action="@{/teacher/my-month}" class="row g-2 mb-3">
        <div class="col-auto"><select name="month" class="form-select">
            <option th:each="n : ${#numbers.sequence(1,12)}" th:value="${n}" th:selected="${n == month}" th:text="${T(java.time.Month).of(n).getDisplayName(T(java.time.format.TextStyle).FULL, T(java.util.Locale).ENGLISH)}"></option></select></div>
        <div class="col-auto"><select name="year" class="form-select">
            <option th:each="y : ${years}" th:value="${y}" th:selected="${y == year}" th:text="${y}"></option></select></div>
        <div class="col-auto"><button class="btn btn-primary">Show</button></div>
    </form>
    <h5 th:text="${monthName + ' ' + year}"></h5>
    <div class="row g-3 mb-3">
        <div class="col-6 col-md-3"><div class="soft-card"><div class="card-pad text-center"><div class="display-6" th:text="${mm.counts.taken}"></div>Lectures taken</div></div></div>
        <div class="col-6 col-md-3"><div class="soft-card"><div class="card-pad text-center"><div class="display-6" th:text="${mm.counts.notTaken}"></div>Not taken</div></div></div>
        <div class="col-6 col-md-3"><div class="soft-card"><div class="card-pad text-center"><div class="display-6" th:text="${mm.percent + '%'}"></div>Taken of due</div></div></div>
        <div class="col-6 col-md-3"><div class="soft-card"><div class="card-pad text-center"><div class="display-6" th:text="${mm.substituteWork}"></div>Taken as substitute</div></div></div>
    </div>
    <div class="soft-card mb-3"><div class="card-pad">
        <h5>Leave and salary</h5>
        <p class="mb-1" th:text="${'Approved leave days this month: ' + mm.leaveDays}"></p>
        <div th:each="l : ${mm.leaves}" class="small text-muted" th:text="${l.fromDate + ' to ' + l.toDate + ' - ' + l.status}"></div>
        <p class="mt-2 mb-0" th:if="${mm.salary != null}" th:text="${'Salary slip ' + mm.salary.slipNumber + ': net Rs. ' + mm.salary.netAmount}"></p>
        <p class="mt-2 mb-0 text-muted" th:if="${mm.salary == null}">No salary slip for this month yet.</p>
    </div></div>
    <div class="soft-card"><div class="card-pad">
        <h5>Lectures</h5>
        <div th:if="${#lists.isEmpty(mm.rows)}" class="text-muted">No lectures planned this month. Ask the admin to generate the monthly timetable.</div>
        <div class="table-responsive" th:unless="${#lists.isEmpty(mm.rows)}">
        <table class="table table-sm align-middle">
            <thead><tr><th>Date</th><th>Time</th><th>Class</th><th>Subject</th><th>Status</th></tr></thead>
            <tbody><tr th:each="r : ${mm.rows}">
                <td th:text="${r.session.lectureDate}"></td><td th:text="${r.timeText}"></td>
                <td th:text="${r.className}"></td><td th:text="${r.subjectName}"></td>
                <td><span class="badge" th:classappend="${r.badgeClass}" th:text="${r.stateLabel}"></span></td>
            </tr></tbody>
        </table></div>
    </div></div>

</div>
</body>
</html>
