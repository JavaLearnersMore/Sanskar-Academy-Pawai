<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Study Material | Sanskar Academy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/portal.css}" rel="stylesheet">
</head>
<body class="portal-body">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/portal-nav :: nav(materials)}"></div>
<div class="portal-wrap">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <h3 class="mb-3">&#128218; Study Material</h3>
    <div class="soft-card mb-3"><div class="card-pad">
        <h5>Add material</h5>
        <form th:action="@{/teacher/materials}" method="post" enctype="multipart/form-data" class="row g-2">
            <div class="col-md-4"><label class="form-label small">Subject</label>
                <select name="subjectId" class="form-select" required>
                    <option th:each="s : ${subjects}" th:value="${s.id}" th:text="${s.classEntity.className + ' - ' + s.subjectName}"></option>
                </select></div>
            <div class="col-md-3"><label class="form-label small">Chapter (optional)</label><input name="chapter" class="form-control" maxlength="120"></div>
            <div class="col-md-5"><label class="form-label small">Title</label><input name="title" class="form-control" maxlength="200" required></div>
            <div class="col-12"><label class="form-label small">Short note (optional)</label><input name="description" class="form-control" maxlength="500"></div>
            <div class="col-md-6"><label class="form-label small">File (PDF, image, Word, Excel, PowerPoint - up to 8 MB)</label><input type="file" name="file" class="form-control"></div>
            <div class="col-md-4"><label class="form-label small">...or a link (https://)</label><input name="link" class="form-control" maxlength="500" placeholder="https://"></div>
            <div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary w-100">Add</button></div>
        </form>
    </div></div>
    <div class="soft-card"><div class="card-pad">
        <h5>Added by me</h5>
        <div th:if="${#lists.isEmpty(list)}" class="text-muted">Nothing yet.</div>
        <table class="table table-sm align-middle" th:unless="${#lists.isEmpty(list)}">
            <thead><tr><th>Title</th><th>Subject</th><th>Chapter</th><th>Open</th><th></th></tr></thead>
            <tbody>
            <tr th:each="m : ${list}">
                <td th:text="${m.title}"></td>
                <td th:text="${m.subject.classEntity.className + ' - ' + m.subject.subjectName}"></td>
                <td th:text="${m.chapter}"></td>
                <td><a th:if="${m.filePath}" th:href="@{'/files/material/' + ${m.id}}" th:text="${m.fileName}"></a>
                    <a th:if="${m.link}" th:href="${m.link}" target="_blank" rel="noopener noreferrer">Open link</a></td>
                <td class="text-end"><form th:action="@{'/teacher/materials/' + ${m.id} + '/delete'}" method="post" onsubmit="return confirm('Delete?')"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td>
            </tr>
            </tbody>
        </table>
    </div></div>

</div>
</body>
</html>
