<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Question Bank | Sanskar Academy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/portal.css}" rel="stylesheet">
</head>
<body class="portal-body">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/portal-nav :: nav(bank)}"></div>
<div class="portal-wrap">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <h3 class="mb-3">&#128451; Question Bank</h3>
    <div class="soft-card mb-3"><div class="card-pad">
        <h5>Add a question</h5>
        <form th:action="@{/teacher/question-bank}" method="post" class="row g-2">
            <div class="col-md-4"><label class="form-label small">Subject</label>
                <select name="subjectId" class="form-select"><option value="">(any)</option>
                    <option th:each="s : ${subjects}" th:value="${s.id}" th:text="${s.classEntity.className + ' - ' + s.subjectName}"></option></select></div>
            <div class="col-md-3"><label class="form-label small">Chapter</label><input name="chapter" class="form-control" maxlength="120"></div>
            <div class="col-md-2"><label class="form-label small">Type</label>
                <select name="type" class="form-select"><option value="MCQ">MCQ</option><option value="SHORT">Short answer</option></select></div>
            <div class="col-md-1"><label class="form-label small">Marks</label><input type="number" min="1" name="marks" value="1" class="form-control"></div>
            <div class="col-md-2"><label class="form-label small">Level</label>
                <select name="difficulty" class="form-select"><option>EASY</option><option selected>MEDIUM</option><option>HARD</option></select></div>
            <div class="col-12"><label class="form-label small">Question</label><textarea name="questionText" class="form-control" rows="2" maxlength="1000" required></textarea></div>
            <div class="col-md-3"><input name="optionA" class="form-control" placeholder="Option A (MCQ)" maxlength="300"></div>
            <div class="col-md-3"><input name="optionB" class="form-control" placeholder="Option B" maxlength="300"></div>
            <div class="col-md-3"><input name="optionC" class="form-control" placeholder="Option C" maxlength="300"></div>
            <div class="col-md-3"><input name="optionD" class="form-control" placeholder="Option D" maxlength="300"></div>
            <div class="col-md-2"><select name="correctOption" class="form-select"><option value="">Correct?</option><option>A</option><option>B</option><option>C</option><option>D</option></select></div>
            <div class="col-md-8"><input name="modelAnswer" class="form-control" placeholder="Model answer (short answer type)" maxlength="1000"></div>
            <div class="col-md-2"><button class="btn btn-primary w-100">Save</button></div>
        </form>
        <hr>
        <form th:action="@{/teacher/question-bank/import}" method="post" class="row g-2 align-items-end">
            <div class="col-md-8"><label class="form-label small">Or save all questions of one of my exams into the bank</label>
                <select name="examId" class="form-select">
                    <option th:each="e : ${exams}" th:value="${e.id}" th:text="${e.title + ' (' + e.subject.subjectName + ')'}"></option></select></div>
            <div class="col-md-4"><button class="btn btn-outline-primary w-100">Import into bank</button></div>
        </form>
    </div></div>

    <form th:action="@{/teacher/question-bank/to-exam}" method="post" class="soft-card"><div class="card-pad">
        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-2">
            <h5 class="mb-0" th:text="${'My questions (' + #lists.size(list) + ')'}"></h5>
            <div class="d-flex gap-2">
                <select name="examId" class="form-select form-select-sm" style="width:260px">
                    <option th:each="e : ${exams}" th:if="${e.status.name() == 'DRAFT'}" th:value="${e.id}" th:text="${'Draft exam: ' + e.title}"></option></select>
                <button class="btn btn-sm btn-success">Add ticked to exam</button>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(list)}" class="text-muted">Your bank is empty.</div>
        <table class="table table-sm align-middle" th:unless="${#lists.isEmpty(list)}">
            <thead><tr><th></th><th>Question</th><th>Subject / Chapter</th><th>Type</th><th>Marks</th><th>Level</th><th>Used</th><th></th></tr></thead>
            <tbody>
            <tr th:each="q : ${list}">
                <td><input type="checkbox" name="ids" th:value="${q.id}"></td>
                <td th:text="${q.questionText}"></td>
                <td><span th:if="${q.subject}" th:text="${q.subject.subjectName}"></span><span th:if="${q.chapter}" th:text="${' / ' + q.chapter}"></span></td>
                <td th:text="${q.type}"></td>
                <td th:text="${q.marks}"></td>
                <td th:text="${q.difficulty}"></td>
                <td th:text="${q.timesUsed}"></td>
                <td class="text-end"><button type="submit" class="btn btn-sm btn-outline-danger" th:formaction="@{'/teacher/question-bank/' + ${q.id} + '/delete'}" onclick="return confirm('Delete this question?')">&times;</button></td>
            </tr>
            </tbody>
        </table>
    </div></form>

</div>
</body>
</html>
