<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Student levels | Sanskar Academy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/portal.css}" rel="stylesheet">
</head>
<body class="portal-body">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/portal-nav :: nav('insights')}"></div>
<div class="portal-wrap">
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<h3 class="mb-1">📊 Student Levels</h3>
<p class="text-muted">Based on the exams of your classes. Use it to find who needs extra help.</p>
<div class="soft-card"><div class="card-pad"><div class="table-responsive">
  <table class="table table-hover align-middle mb-0">
    <thead class="table-light"><tr><th>Student</th><th>Class</th><th>Exams taken</th><th style="min-width:180px">Average</th><th>Last</th><th>Trend</th><th>Level</th></tr></thead>
    <tbody>
      <tr th:each="s : ${levels}">
        <td class="fw-semibold" th:text="${s.studentName}"></td>
        <td th:text="${s.className}"></td>
        <td th:text="${s.examsTaken}"></td>
        <td><div class="progress" style="height:10px"><div class="progress-bar" th:style="'width:' + ${s.averagePercent} + '%'"></div></div>
            <small th:text="${s.examsTaken == 0} ? '-' : ${s.averagePercent} + '%'"></small></td>
        <td th:text="${s.examsTaken == 0} ? '-' : ${s.lastPercent} + '%'"></td>
        <td th:text="${s.trendLabel}"></td>
        <td><span class="badge" th:classappend="${s.badgeClass}" th:text="${s.level}"></span></td>
      </tr>
    </tbody></table></div>
  <div class="empty-note" th:if="${#lists.isEmpty(levels)}">No students found.</div>
</div></div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
