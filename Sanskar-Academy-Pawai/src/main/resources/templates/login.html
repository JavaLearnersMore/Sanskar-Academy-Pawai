<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login | Sanskar Academy Classes</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #002147, #00509E);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 1100px;
            background: #ffffff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            display: flex;
        }

        .login-image {
            width: 50%;
            background: url('https://images.unsplash.com/photo-1588072432836-e10032774350')
                        center/cover no-repeat;
        }

        .login-form {
            width: 50%;
            padding: 60px;
        }

        .btn-primary {
            background-color: #00509E;
            border: none;
        }

        .btn-primary:hover {
            background-color: #002147;
        }

        .create-btn {
            background-color: #ffc107;
            border: none;
            color: #000;
        }

        .create-btn:hover {
            background-color: #e0a800;
        }

        @media(max-width: 768px){
            .login-container {
                flex-direction: column;
            }
            .login-image {
                height: 250px;
                width: 100%;
            }
            .login-form {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <!-- LEFT SIDE IMAGE -->
    <div class="login-image"></div>

    <!-- RIGHT SIDE LOGIN FORM -->
    <div class="login-form">

        <h2 class="mb-4 fw-bold text-primary">
            🎓 Sanskar Academy Classes
        </h2>

        <h5 class="mb-4">Welcome Back 👋</h5>

        <!-- Error Message -->
        <div th:if="${param.error}" class="alert alert-danger">
            Invalid username or password
        </div>

        <div th:if="${param.logout}" class="alert alert-success">
            You have been logged out successfully.
        </div>

        <form th:action="@{/login}" method="post">

            <!-- CSRF -->
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text"
                       name="username"
                       class="form-control"
                       placeholder="Enter username"
                       required>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Enter password"
                       required>
            </div>

            <button type="submit"
                    class="btn btn-primary w-100 mb-3">
                Login
            </button>
            
            <div class="text-center mt-3">
             <a th:href="@{/resend-verification}" class="text-warning">
             Resend Verification Email
             </a>
           </div>

            <!-- CREATE ACCOUNT BUTTON -->
            <a th:href="@{/register}" 
               class="btn create-btn w-100">
                Create New Account
            </a>

        </form>

    </div>

</div>

</body>
</html>
