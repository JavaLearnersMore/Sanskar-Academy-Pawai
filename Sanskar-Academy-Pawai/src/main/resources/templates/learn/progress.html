<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Progress | Sanskar Academy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/portal.css}" rel="stylesheet">
</head>
<body class="portal-body">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/portal-nav :: nav(progress)}"></div>
<div class="portal-wrap">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <h3 class="mb-3">&#128200; Progress</h3>
    <div th:replace="~{learn/parts :: picker(${base}, ${base + '/progress'})}"></div>
    <div th:if="${pr == null}" class="alert alert-info">Nothing to show yet.</div>
    <div th:if="${pr != null}">
        <div class="row g-3 mb-3">
            <div class="col-6 col-md-3"><div class="soft-card"><div class="card-pad text-center"><div class="display-6" th:text="${pr.attendancePercent + '%'}"></div>Attendance<div class="small text-muted" th:text="${pr.presentDays + ' of ' + pr.totalDays + ' lectures'}"></div></div></div></div>
            <div class="col-6 col-md-3"><div class="soft-card"><div class="card-pad text-center"><div class="display-6" th:text="${pr.hasExams ? pr.examAvg + '%' : '-'}"></div>Average in exams</div></div></div>
            <div class="col-6 col-md-3"><div class="soft-card"><div class="card-pad text-center"><div class="display-6" th:text="${pr.hwDone + ' / ' + pr.hwTotal}"></div>Homework submitted</div></div></div>
            <div class="col-6 col-md-3"><div class="soft-card"><div class="card-pad text-center"><div class="display-6" th:text="${pr.hwOverdue}"></div>Homework overdue</div></div></div>
        </div>
        <div class="alert alert-light border" th:if="${pr.weakest != null and pr.weakest != pr.strongest}">
            Strongest subject: <b th:text="${pr.strongest}"></b> &middot; Needs more practice: <b th:text="${pr.weakest}"></b>
        </div>
        <div class="soft-card mb-3"><div class="card-pad">
            <h5>Subject wise</h5>
            <table class="table align-middle mb-0">
                <thead><tr><th>Subject</th><th>Attendance</th><th>Exam marks</th></tr></thead>
                <tbody><tr th:each="s : ${pr.subjects}">
                    <td th:text="${s.subject}"></td>
                    <td><div class="progress" style="height:8px"><div class="progress-bar" th:classappend="${s.attendancePercent lt 75} ? 'bg-danger' : 'bg-success'" th:style="${'width:' + s.attendancePercent + '%'}"></div></div>
                        <span class="small" th:text="${s.total == 0 ? 'no lectures marked' : s.attendancePercent + '% (' + s.present + '/' + s.total + ')'}"></span></td>
                    <td><span th:if="${s.hasExam}" th:text="${s.marksPercent + '% (' + s.score + '/' + s.outOf + ')'}"></span><span th:unless="${s.hasExam}" class="text-muted small">no exam yet</span></td>
                </tr></tbody>
            </table>
        </div></div>
        <div class="soft-card" th:if="${pr.hasExams}"><div class="card-pad">
            <h5>Exam history (oldest first)</h5>
            <table class="table table-sm mb-0"><tbody><tr th:each="x : ${pr.exams}">
                <td th:text="${x.date}"></td><td th:text="${x.title}"></td><td th:text="${x.subject}"></td>
                <td style="width:35%"><div class="progress" style="height:8px"><div class="progress-bar" th:style="${'width:' + x.percent + '%'}"></div></div></td>
                <td th:text="${x.percent + '%'}"></td>
            </tr></tbody></table>
        </div></div>
    </div>

</div>
</body>
</html>
