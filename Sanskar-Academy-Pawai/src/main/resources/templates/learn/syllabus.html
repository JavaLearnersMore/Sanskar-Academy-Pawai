<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Syllabus | Sanskar Academy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/portal.css}" rel="stylesheet">
</head>
<body class="portal-body">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/portal-nav :: nav(syllabus)}"></div>
<div class="portal-wrap">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <h3 class="mb-3">&#128215; Syllabus Progress</h3>
    <div th:replace="~{learn/parts :: picker(${base}, ${base + '/syllabus'})}"></div>
    <div th:if="${#lists.isEmpty(list)}" class="soft-card"><div class="card-pad text-muted">Nothing to show yet.</div></div>
    <div class="soft-card mb-3" th:each="sp : ${list}" th:unless="${#lists.isEmpty(sp.chapters)}"><div class="card-pad">
        <div class="d-flex justify-content-between flex-wrap"><h5 th:text="${sp.subject.subjectName}"></h5>
            <span th:text="${sp.done + ' / ' + sp.total + ' chapters (' + sp.percent + '%)'}"></span></div>
        <div class="progress mb-2" style="height:10px"><div class="progress-bar bg-success" th:style="${'width:' + sp.percent + '%'}"></div></div>
        <table class="table table-sm mb-0"><tbody><tr th:each="c : ${sp.chapters}">
            <td th:text="${c.orderNo}"></td><td th:text="${c.title}"></td>
            <td><span th:if="${c.completedOn != null}" class="badge bg-success" th:text="${'Done ' + c.completedOn}"></span>
                <span th:if="${c.completedOn == null}" class="badge bg-light text-dark border">Pending</span></td>
        </tr></tbody></table>
    </div></div>

</div>
</body>
</html>
