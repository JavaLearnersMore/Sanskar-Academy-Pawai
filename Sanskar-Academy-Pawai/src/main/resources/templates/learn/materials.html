<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Study Material | Sanskar Academy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/portal.css}" rel="stylesheet">
</head>
<body class="portal-body">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/portal-nav :: nav(materials)}"></div>
<div class="portal-wrap">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <h3 class="mb-3">&#128218; Study Material</h3>
    <div th:replace="~{learn/parts :: picker(${base}, ${base + '/materials'})}"></div>
    <div th:if="${#lists.isEmpty(list)}" class="soft-card"><div class="card-pad text-muted">No material yet.</div></div>
    <div class="soft-card"><div class="card-pad" th:unless="${#lists.isEmpty(list)}">
        <table class="table align-middle">
            <thead><tr><th>Subject</th><th>Chapter</th><th>Title</th><th>Open</th><th>Added</th></tr></thead>
            <tbody><tr th:each="m : ${list}">
                <td th:text="${m.subject.subjectName}"></td>
                <td th:text="${m.chapter}"></td>
                <td><b th:text="${m.title}"></b><div class="small text-muted" th:text="${m.description}"></div></td>
                <td><a th:if="${m.filePath}" th:href="@{'/files/material/' + ${m.id}}" th:text="${m.fileName}"></a>
                    <a th:if="${m.link}" th:href="${m.link}" target="_blank" rel="noopener noreferrer">Open link</a></td>
                <td class="small" th:text="${#temporals.format(m.uploadedAt, 'dd MMM yyyy')}"></td>
            </tr></tbody>
        </table>
    </div></div>

</div>
</body>
</html>
