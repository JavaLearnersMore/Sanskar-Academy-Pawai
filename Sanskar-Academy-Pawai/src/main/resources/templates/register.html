<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Account | Sanskar Academy</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #002147, #00509E);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-card {
            width: 100%;
            max-width: 500px;
            border-radius: 15px;
        }
    </style>
</head>

<body>

<div class="card shadow-lg register-card">
    <div class="card-body p-4">

        <h3 class="text-center mb-4 text-primary">
            🎓 Create Account
        </h3>

        <form th:action="@{/register}" th:object="${registerDto}" method="post">

            <div class="mb-3">
                <label>Full Name</label>
                <input type="text" th:field="*{fullName}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Username</label>
                <input type="text" th:field="*{username}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" th:field="*{email}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Mobile Number</label>
                <input type="text" th:field="*{mobileNumber}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" th:field="*{password}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Select Role</label>
                <select th:field="*{role}" class="form-select" required>
                    <option value="">-- Select Role --</option>
                    <option value="STUDENT">Student</option>
                    <option value="PARENT">Parent</option>
                    <option value="TEACHER">Teacher</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Create Account
            </button>

            <div class="text-center mt-3">
                <a th:href="@{/login}">Already have an account? Login</a>
            </div>

        </form>

    </div>
</div>

</body>
</html>
