<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Staff Leave Requests | Sanskar Academy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/portal.css}" rel="stylesheet">
    <style> body { background-color: #f4f6f9; } .card { border-radius: 12px; } </style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container-fluid"><div class="row">
    <div class="col-md-2 p-0"><div th:replace="~{fragments/sidebar :: sidebar}"></div></div>
    <div class="col-md-10 p-4">
        <h3 class="mb-3">Staff Leave Requests</h3>
        <div th:replace="~{fragments/staff-tabs :: tabs('leaves')}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card shadow-sm"><div class="card-body">
            <div class="table-responsive"><table class="table align-middle">
            <thead class="table-light"><tr><th>Staff</th><th>Dates</th><th>Working days</th><th>Reason</th><th>Status</th><th style="min-width:280px;">Decision</th></tr></thead>
            <tbody>
            <tr th:each="l : ${leaves}">
                <td><div class="fw-semibold" th:text="${l.staff.user.fullName}"></div><small class="text-muted" th:text="${l.staff.designation}"></small></td>
                <td th:text="${#temporals.format(l.fromDate,'dd MMM')} + ' - ' + ${#temporals.format(l.toDate,'dd MMM yyyy')}"></td>
                <td th:text="${l.days}"></td>
                <td th:text="${l.reason}" style="max-width:260px;"></td>
                <td><span class="badge" th:classappend="${l.badgeClass}" th:text="${l.status}"></span></td>
                <td>
                    <form th:if="${l.status.name() == 'PENDING'}" th:action="@{/admin/staff/leaves/{id}/decide(id=${l.id})}" method="post" class="d-flex gap-1 m-0">
                        <input name="note" class="form-control form-control-sm" placeholder="Note (optional)" maxlength="290">
                        <button name="action" value="APPROVE" class="btn btn-sm btn-success">Approve</button>
                        <button name="action" value="REJECT" class="btn btn-sm btn-danger">Reject</button>
                    </form>
                    <span th:unless="${l.status.name() == 'PENDING'}" class="text-muted small" th:text="${l.adminNote}"></span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(leaves)}"><td colspan="6" class="text-center text-muted py-4">No leave requests</td></tr>
            </tbody></table></div>
            <div class="small text-muted">Approving a leave marks those working days as "On leave" in the attendance sheet automatically.</div>
        </div></div>

    </div></div></div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
