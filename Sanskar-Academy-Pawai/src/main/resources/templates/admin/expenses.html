<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Expenses | Sanskar Academy</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }
        .card {
            border-radius: 12px;
        }
    </style>
</head>

<body>

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 p-0">
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 p-4">

            <h2 class="mb-4">💸 Expenses Management</h2>

            <!-- ================= ADD EXPENSE FORM ================= -->
            <div class="card shadow mb-4">
                <div class="card-body">
                    <h5 class="mb-3">Add New Expense</h5>

                    <form th:action="@{/admin/expenses}"
                          th:object="${expense}"
                          method="post">

                        <div class="row">

                            <!-- Expense Title -->
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Expense Title</label>
                                <input type="text"
                                       th:field="*{expenseTitle}"
                                       class="form-control"
                                       required>
                            </div>

                            <!-- Description -->
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Description</label>
                                <input type="text"
                                       th:field="*{description}"
                                       class="form-control">
                            </div>

                            <!-- Category -->
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Category</label>
                                <select th:field="*{category}"
                                        class="form-select"
                                        required>
                                    <option value="">-- Select Category --</option>
                                    <option th:each="cat : ${T(com.sanskaracademy.entity.ExpenseCategory).values()}"
                                            th:value="${cat}"
                                            th:text="${cat}">
                                    </option>
                                </select>
                            </div>

                        </div>

                        <div class="row">

                            <!-- Amount -->
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Amount (₹)</label>
                                <input type="number"
                                       step="0.01"
                                       th:field="*{amount}"
                                       class="form-control"
                                       required>
                            </div>

                            <!-- Expense Date -->
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Expense Date</label>
                                <input type="date"
                                       th:field="*{expenseDate}"
                                       class="form-control">
                            </div>

                        </div>

                        <button type="submit"
                                class="btn btn-danger">
                            Add Expense
                        </button>

                    </form>
                </div>
            </div>

            <!-- ================= EXPENSES TABLE ================= -->
            <div class="card shadow">
                <div class="card-body">

                    <h5 class="mb-3">All Expenses</h5>

                    <table class="table table-bordered table-hover">
                        <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Amount (₹)</th>
                            <th>Date</th>
                            <th>Recorded By</th>
                            <th>Action</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:each="exp : ${expenses}">
                            <td th:text="${exp.id}"></td>
                            <td th:text="${exp.expenseTitle}"></td>
                            <td th:text="${exp.description}"></td>
                            <td th:text="${exp.category}"></td>
                            <td th:text="${exp.amount}"></td>
                            <td th:text="${exp.expenseDate}"></td>
                            <td th:text="${exp.recordedBy != null ? exp.recordedBy.fullName : 'N/A'}"></td>

                            <td>
                                <form th:action="@{/admin/delete-expense/{id}(id=${exp.id})}"
                                      method="post">
                                    <button class="btn btn-sm btn-outline-danger">
                                        Delete
                                    </button>
                                </form>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(expenses)}">
                            <td colspan="8" class="text-center text-muted">
                                No expenses added yet.
                            </td>
                        </tr>

                        </tbody>
                    </table>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
