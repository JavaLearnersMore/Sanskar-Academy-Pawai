<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Fees | Sanskar Academy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/portal.css}" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .card { border-radius: 12px; }
    </style>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container-fluid">
    <div class="row">

        <div class="col-md-2 p-0">
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-10 p-4">

            <h3 class="mb-4">🧾 Student Fees</h3>

            <!-- Messages -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Summary tiles -->
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="stat-tile">
                        <div class="stat-icon ic-blue">🎯</div>
                        <div>
                            <div class="stat-label">Total Payable</div>
                            <div class="stat-value">₹ <span th:text="${#numbers.formatDecimal(totalPayable,1,'COMMA',2,'POINT')}">0</span></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-tile">
                        <div class="stat-icon ic-green">💵</div>
                        <div>
                            <div class="stat-label">Collected</div>
                            <div class="stat-value">₹ <span th:text="${#numbers.formatDecimal(totalPaid,1,'COMMA',2,'POINT')}">0</span></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-tile">
                        <div class="stat-icon ic-red">⏳</div>
                        <div>
                            <div class="stat-label">Pending</div>
                            <div class="stat-value">₹ <span th:text="${#numbers.formatDecimal(totalPending,1,'COMMA',2,'POINT')}">0</span></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-tile">
                        <div class="stat-icon ic-orange">👨‍🎓</div>
                        <div>
                            <div class="stat-label">Students With Dues</div>
                            <div class="stat-value" th:text="${studentsWithDues}">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="card shadow">
                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mb-0">Fee Status</h5>
                        <input type="text" id="searchBox" class="form-control w-25"
                               placeholder="🔍 Search student...">
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle" id="feeTable">
                            <thead class="table-dark">
                            <tr>
                                <th>Student</th>
                                <th class="text-end">Payable</th>
                                <th class="text-end">Paid</th>
                                <th class="text-end">Pending</th>
                                <th style="min-width:130px;">Progress</th>
                                <th>Status</th>
                                <th>Due Date</th>
                                <th class="text-end">Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="s : ${summaries}">
                                <td>
                                    <div class="fw-semibold" th:text="${s.studentName}"></div>
                                    <small class="text-muted" th:text="${s.email}"></small>
                                </td>
                                <td class="text-end" th:text="${#numbers.formatDecimal(s.payable,1,'COMMA',2,'POINT')}"></td>
                                <td class="text-end text-success" th:text="${#numbers.formatDecimal(s.paid,1,'COMMA',2,'POINT')}"></td>
                                <td class="text-end text-danger fw-semibold" th:text="${#numbers.formatDecimal(s.pending,1,'COMMA',2,'POINT')}"></td>
                                <td>
                                    <div class="progress fee-progress">
                                        <div class="progress-bar bg-success" role="progressbar"
                                             th:style="'width:' + ${s.percentPaid} + '%'"></div>
                                    </div>
                                    <small class="text-muted" th:text="${s.percentPaid} + '%'"></small>
                                </td>
                                <td>
                                    <span class="badge" th:classappend="${s.badgeClass}" th:text="${s.statusLabel}"></span>
                                    <span th:if="${s.overdue}" class="badge bg-dark">Overdue</span>
                                </td>
                                <td th:text="${s.dueDate != null} ? ${#temporals.format(s.dueDate,'dd MMM yyyy')} : '-'"></td>
                                <td class="text-end text-nowrap">

                                    <button type="button" class="btn btn-sm btn-outline-primary btn-setfee"
                                            data-bs-toggle="modal" data-bs-target="#planModal"
                                            th:data-id="${s.studentId}"
                                            th:data-name="${s.studentName}"
                                            th:data-total="${s.totalFee}"
                                            th:data-discount="${s.discount}"
                                            th:data-year="${s.academicYear}"
                                            th:data-due="${s.dueDate}">
                                        Set Fee
                                    </button>

                                    <button type="button" class="btn btn-sm btn-success btn-collect"
                                            data-bs-toggle="modal" data-bs-target="#payModal"
                                            th:data-id="${s.studentId}"
                                            th:data-name="${s.studentName}"
                                            th:data-pending="${s.pending}"
                                            th:disabled="${s.status == 'NOT_SET' or s.status == 'PAID'}">
                                        Collect
                                    </button>

                                    <a class="btn btn-sm btn-outline-secondary"
                                       th:href="@{/admin/fees/student/{id}(id=${s.studentId})}">
                                        History
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(summaries)}">
                                <td colspan="8" class="text-center text-muted py-4">No students found</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<input type="hidden" id="defaultYear" th:value="${defaultYear}">

<!-- ============ SET FEE MODAL ============ -->
<div class="modal fade" id="planModal" tabindex="-1">
    <div class="modal-dialog">
        <form class="modal-content" th:action="@{/admin/fees/plan}" method="post">
            <div class="modal-header">
                <h5 class="modal-title">Set Fee – <span id="planStudentName"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" name="studentId" id="planStudentId">

                <div class="mb-3">
                    <label class="form-label">Academic Year</label>
                    <input type="text" name="academicYear" id="planYear" class="form-control" placeholder="2026-27">
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label">Total Fee (₹)</label>
                        <input type="number" step="0.01" min="1" name="totalFee" id="planTotal"
                               class="form-control" required>
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label">Discount (₹)</label>
                        <input type="number" step="0.01" min="0" name="discount" id="planDiscount"
                               class="form-control" value="0">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Due Date</label>
                    <input type="date" name="dueDate" id="planDue" class="form-control">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Fee</button>
            </div>
        </form>
    </div>
</div>

<!-- ============ COLLECT PAYMENT MODAL ============ -->
<div class="modal fade" id="payModal" tabindex="-1">
    <div class="modal-dialog">
        <form class="modal-content" th:action="@{/admin/fees/pay}" method="post">
            <div class="modal-header">
                <h5 class="modal-title">Collect Fee – <span id="payStudentName"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" name="studentId" id="payStudentId">

                <div class="alert alert-info py-2">
                    Pending: <strong>₹ <span id="payPending"></span></strong>
                </div>

                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label">Amount (₹)</label>
                        <input type="number" step="0.01" min="0.01" name="amount" id="payAmount"
                               class="form-control" required>
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label">Payment Mode</label>
                        <select name="paymentMode" class="form-select" required>
                            <option th:each="m : ${paymentModes}" th:value="${m}" th:text="${m}"></option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Payment Date</label>
                    <input type="date" name="paymentDate" class="form-control" th:value="${today}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Remarks (optional)</label>
                    <input type="text" name="remarks" class="form-control" maxlength="200">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-success">Save &amp; Generate Receipt</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Fill "Set Fee" modal
    document.querySelectorAll('.btn-setfee').forEach(function (b) {
        b.addEventListener('click', function () {
            document.getElementById('planStudentId').value = b.dataset.id;
            document.getElementById('planStudentName').textContent = b.dataset.name;
            document.getElementById('planYear').value = b.dataset.year || document.getElementById('defaultYear').value;
            document.getElementById('planTotal').value = b.dataset.total && Number(b.dataset.total) > 0 ? b.dataset.total : '';
            document.getElementById('planDiscount').value = b.dataset.discount || 0;
            document.getElementById('planDue').value = b.dataset.due || '';
        });
    });

    // Fill "Collect" modal
    document.querySelectorAll('.btn-collect').forEach(function (b) {
        b.addEventListener('click', function () {
            document.getElementById('payStudentId').value = b.dataset.id;
            document.getElementById('payStudentName').textContent = b.dataset.name;
            document.getElementById('payPending').textContent = b.dataset.pending;
            var amt = document.getElementById('payAmount');
            amt.max = b.dataset.pending;
            amt.value = b.dataset.pending;
        });
    });

    // Search filter
    document.getElementById('searchBox').addEventListener('keyup', function () {
        var q = this.value.toLowerCase();
        document.querySelectorAll('#feeTable tbody tr').forEach(function (r) {
            r.style.display = r.textContent.toLowerCase().indexOf(q) > -1 ? '' : 'none';
        });
    });
</script>

</body>
</html>
