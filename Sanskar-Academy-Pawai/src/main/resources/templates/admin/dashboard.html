<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard | Sanskar Academy</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .dashboard-title {
            font-weight: 600;
        }

        .card {
            border-radius: 12px;
        }

        .stat-card {
            transition: 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>

<body>

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 p-0">
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 p-4">

            <h2 class="dashboard-title mb-4">Admin Dashboard</h2>

            <!-- Stats Cards -->
            <div class="row">

                <div class="col-md-3 mb-4">
                    <div class="card shadow stat-card bg-primary text-white">
                        <div class="card-body">
                            <h6>Total Students</h6>
                            <h3 th:text="${totalStudents}">0</h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-3 mb-4">
                    <div class="card shadow stat-card bg-success text-white">
                        <div class="card-body">
                            <h6>Total Teachers</h6>
                            <h3 th:text="${totalTeachers}">0</h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-3 mb-4">
                    <div class="card shadow stat-card bg-warning text-dark">
                        <div class="card-body">
                            <h6>Total Income</h6>
                            <h3>₹ <span th:text="${totalIncome}">0</span></h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-3 mb-4">
                    <div class="card shadow stat-card bg-danger text-white">
                        <div class="card-body">
                            <h6>Net Profit</h6>
                            <h3>₹ <span th:text="${netProfit}">0</span></h3>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Finance Chart Section -->
             <!-- Chart Section -->
            <div class="card shadow mt-4">
                <div class="card-body">
                    <h5 class="mb-3">Finance Overview</h5>
                    <canvas id="financeChart" style="max-height:350px;"></canvas>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script th:inline="javascript">
/*<![CDATA[*/

    const income = /*[[${totalIncome}]]*/ 0;
    const profit = /*[[${netProfit}]]*/ 0;

    const ctx = document.getElementById('financeChart').getContext('2d');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Total Income', 'Net Profit'],
            datasets: [{
                label: 'Finance Summary',
                data: [income, profit],
                backgroundColor: ['#198754', '#0d6efd']
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

/*]]>*/
</script>

</body>
</html>
