<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Fee History | Sanskar Academy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/portal.css}" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .card { border-radius: 12px; }
    </style>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container-fluid">
    <div class="row">

        <div class="col-md-2 p-0">
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-10 p-4">

            <a th:href="@{/admin/fees}" class="btn btn-sm btn-outline-secondary mb-3">← Back to Fees</a>

            <h3 class="mb-4">
                🧾 Fee History – <span th:text="${summary.studentName}"></span>
                <span class="badge fs-6 align-middle" th:classappend="${summary.badgeClass}"
                      th:text="${summary.statusLabel}"></span>
            </h3>

            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="stat-tile">
                        <div class="stat-icon ic-blue">🎯</div>
                        <div>
                            <div class="stat-label">Payable</div>
                            <div class="stat-value">₹ <span th:text="${#numbers.formatDecimal(summary.payable,1,'COMMA',2,'POINT')}"></span></div>
                            <small class="text-muted" th:if="${summary.discount.signum() > 0}"
                                   th:text="'after discount ₹ ' + ${summary.discount}"></small>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-tile">
                        <div class="stat-icon ic-green">💵</div>
                        <div>
                            <div class="stat-label">Paid</div>
                            <div class="stat-value">₹ <span th:text="${#numbers.formatDecimal(summary.paid,1,'COMMA',2,'POINT')}"></span></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-tile">
                        <div class="stat-icon ic-red">⏳</div>
                        <div>
                            <div class="stat-label">Pending</div>
                            <div class="stat-value">₹ <span th:text="${#numbers.formatDecimal(summary.pending,1,'COMMA',2,'POINT')}"></span></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-tile">
                        <div class="stat-icon ic-purple">📅</div>
                        <div>
                            <div class="stat-label">Due Date</div>
                            <div class="stat-value fs-5"
                                 th:text="${summary.dueDate != null} ? ${#temporals.format(summary.dueDate,'dd MMM yyyy')} : '-'"></div>
                            <span th:if="${summary.overdue}" class="badge bg-dark">Overdue</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow">
                <div class="card-body">
                    <h5 class="mb-3">Payments</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-dark">
                            <tr>
                                <th>Receipt No.</th>
                                <th>Date</th>
                                <th>Mode</th>
                                <th class="text-end">Amount (₹)</th>
                                <th>Remarks</th>
                                <th></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="p : ${payments}">
                                <td th:text="${p.receiptNumber}"></td>
                                <td th:text="${#temporals.format(p.paymentDate,'dd MMM yyyy')}"></td>
                                <td><span class="badge bg-info text-dark" th:text="${p.paymentMode}"></span></td>
                                <td class="text-end fw-semibold" th:text="${#numbers.formatDecimal(p.amountPaid,1,'COMMA',2,'POINT')}"></td>
                                <td th:text="${p.remarks}"></td>
                                <td class="text-end">
                                    <a class="btn btn-sm btn-outline-primary"
                                       th:href="@{/admin/fees/receipt/{id}(id=${p.id})}">🖨 Receipt</a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(payments)}">
                                <td colspan="6" class="text-center text-muted py-4">No payments yet</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
