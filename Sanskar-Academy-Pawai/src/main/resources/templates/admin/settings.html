<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<title>System Settings</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:#f4f6f9;
}

.setting-card{
border-radius:15px;
transition:0.3s;
}

.setting-card:hover{
transform:translateY(-5px);
}
</style>

</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container-fluid">

<div class="row">

<div class="col-lg-2 p-0">
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
</div>

<div class="col-lg-10 p-4">

<h3 class="mb-4">⚙ System Settings</h3>

<div class="row g-4">

<div class="col-lg-4 col-md-6">

<div class="card setting-card shadow text-center p-4">

<h5>Pending Approvals</h5>

<h3 th:text="${#lists.size(pendingUsers)}"></h3>

<a th:href="@{/admin/pending-users}" class="btn btn-primary mt-3">
View Pending Users
</a>

</div>
</div>

<div class="col-lg-4 col-md-6">

<div class="card setting-card shadow text-center p-4">

<h5>Change Password</h5>

<a th:href="@{/admin/change-password}" class="btn btn-warning mt-3">
Update Password
</a>

</div>

</div>

<div class="col-lg-4 col-md-6">

<div class="card setting-card shadow text-center p-4">

<h5>2FA Settings</h5>

<a th:href="@{/admin/regenerate-qr}" class="btn btn-success mt-3">
Regenerate QR
</a>

</div>

</div>

</div>

</div>

</div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
