<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Audit Log | Sanskar Academy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/portal.css}" rel="stylesheet">
    <style>body { background-color: #f4f6f9; } .card { border-radius: 12px; } .stat { font-size: 1.9rem; font-weight: 600; line-height: 1.1; }</style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container-fluid"><div class="row">
<div class="col-md-2 p-0"><div th:replace="~{fragments/sidebar :: sidebar}"></div></div>
<div class="col-md-10 p-4">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <h3 class="mb-1">&#128220; Audit Log</h3>
    <p class="text-muted">Every save / delete / approve action by a logged-in user. Form contents are not stored. Lines older than <span th:text="${retention}"></span> days are removed automatically.</p>
    <form method="get" th:action="@{/admin/audit-log}" class="row g-2 mb-3">
        <div class="col-md-2"><label class="form-label small">From</label><input type="date" name="from" class="form-control" th:value="${from}"></div>
        <div class="col-md-2"><label class="form-label small">To</label><input type="date" name="to" class="form-control" th:value="${to}"></div>
        <div class="col-md-2"><label class="form-label small">Username</label><input name="user" class="form-control" th:value="${user}"></div>
        <div class="col-md-2"><label class="form-label small">Action</label>
            <select name="method" class="form-select"><option value="">All</option>
                <option th:each="m : ${ {'POST','DELETE','PUT','PATCH'} }" th:value="${m}" th:selected="${m == method}" th:text="${m}"></option></select></div>
        <div class="col-md-2"><label class="form-label small">Show up to</label>
            <select name="limit" class="form-select"><option th:each="n : ${ {100,300,1000} }" th:value="${n}" th:selected="${n == limit}" th:text="${n}"></option></select></div>
        <div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary w-100">Show</button></div>
    </form>
    <div class="card"><div class="card-body">
        <div th:if="${#lists.isEmpty(list)}" class="text-muted">No actions found for this filter.</div>
        <div class="table-responsive" th:unless="${#lists.isEmpty(list)}">
        <table class="table table-sm table-hover mb-0">
            <thead><tr><th>Time</th><th>User</th><th>Role</th><th>Action</th><th>Address</th><th>Result</th><th>IP</th></tr></thead>
            <tbody><tr th:each="a : ${list}">
                <td class="text-nowrap" th:text="${#temporals.format(a.loggedAt, 'dd MMM yyyy HH:mm:ss')}"></td>
                <td th:text="${a.username}"></td><td th:text="${a.role}"></td>
                <td><span class="badge" th:classappend="${a.method == 'DELETE'} ? 'bg-danger' : 'bg-secondary'" th:text="${a.method}"></span></td>
                <td><code th:text="${a.path}"></code></td>
                <td th:text="${a.status}"></td><td class="small" th:text="${a.ip}"></td>
            </tr></tbody>
        </table></div>
    </div></div>

</div></div></div>
</body>
</html>
