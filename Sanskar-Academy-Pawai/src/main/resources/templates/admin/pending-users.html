<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pending Users | Sanskar Academy</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #f4f6f9; }
        .card { border-radius: 12px; }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container-fluid">
    <div class="row">

        <div class="col-md-2 p-0">
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-10 p-4">

            <h3 class="mb-4">🛡 Pending User Approvals</h3>

            <div class="card shadow">
                <div class="card-body">

                    <table class="table table-bordered table-hover">
                        <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Action</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="user : ${pendingUsers}">
                            <td th:text="${user.id}"></td>
                            <td th:text="${user.fullName}"></td>
                            <td th:text="${user.email}"></td>
                            <td th:text="${user.role.name}"></td>
                            <td>
                                <form th:action="@{/admin/approve-user/{id}(id=${user.id})}"
                                      method="post" style="display:inline;">
                                    <button class="btn btn-success btn-sm">
                                        Approve
                                    </button>
                                </form>

                                <form th:action="@{/admin/reject-user/{id}(id=${user.id})}"
                                      method="post" style="display:inline;">
                                    <button class="btn btn-danger btn-sm">
                                        Reject
                                    </button>
                                </form>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(pendingUsers)}">
                            <td colspan="5" class="text-center text-muted">
                                No pending users 🎉
                            </td>
                        </tr>

                        </tbody>
                    </table>

                </div>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
