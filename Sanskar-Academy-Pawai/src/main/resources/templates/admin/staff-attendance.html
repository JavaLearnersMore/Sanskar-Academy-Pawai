<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Staff Attendance | Sanskar Academy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/portal.css}" rel="stylesheet">
    <style> body { background-color: #f4f6f9; } .card { border-radius: 12px; } </style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container-fluid"><div class="row">
    <div class="col-md-2 p-0"><div th:replace="~{fragments/sidebar :: sidebar}"></div></div>
    <div class="col-md-10 p-4">
        <h3 class="mb-3">Staff Attendance</h3>
        <div th:replace="~{fragments/staff-tabs :: tabs('attendance')}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form method="get" th:action="@{/admin/staff/attendance}" class="row g-2 mb-3">
            <div class="col-auto"><input type="date" name="date" class="form-control" th:value="${date}" th:max="${today}"></div>
            <div class="col-auto"><button class="btn btn-outline-primary">Open date</button></div>
        </form>
        <div class="card shadow-sm"><div class="card-body">
        <form th:action="@{/admin/staff/attendance}" method="post">
            <input type="hidden" name="date" th:value="${date}">
            <div class="d-flex justify-content-between mb-2">
                <h5 class="mb-0" th:text="${#temporals.format(date,'EEEE, dd MMM yyyy')}"></h5>
                <button type="button" class="btn btn-sm btn-outline-success" onclick="document.querySelectorAll('select.att').forEach(function(s){ if(s.value==='') s.value='PRESENT'; });">All unmarked = Present</button>
            </div>
            <div class="table-responsive"><table class="table align-middle">
                <thead class="table-light"><tr><th>Staff</th><th style="width:210px;">Status</th><th>Remark</th></tr></thead>
                <tbody>
                <tr th:each="r : ${rows}">
                    <td><div class="fw-semibold" th:text="${r.staff.user.fullName}"></div><small class="text-muted" th:text="${r.staff.designation}"></small></td>
                    <td th:if="${r.offReason != null}" colspan="2"><span class="badge bg-secondary" th:text="${r.offReason}"></span> <span class="text-muted small">no attendance needed</span></td>
                    <td th:if="${r.offReason == null}">
                        <select class="form-select att" th:name="'status_' + ${r.staff.id}">
                            <option value="" th:selected="${r.status == ''}">Not marked</option>
                            <option value="PRESENT" th:selected="${r.status == 'PRESENT'}">Present</option>
                            <option value="ABSENT" th:selected="${r.status == 'ABSENT'}">Absent</option>
                            <option value="HALF_DAY" th:selected="${r.status == 'HALF_DAY'}">Half day</option>
                            <option value="LEAVE" th:selected="${r.status == 'LEAVE'}">On leave</option>
                        </select></td>
                    <td th:if="${r.offReason == null}"><input class="form-control" maxlength="190" th:name="'remark_' + ${r.staff.id}" th:value="${r.remark}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(rows)}"><td colspan="3" class="text-center text-muted py-4">No active staff</td></tr>
                </tbody></table></div>
            <button class="btn btn-primary">Save attendance</button>
        </form></div></div>

    </div></div></div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
