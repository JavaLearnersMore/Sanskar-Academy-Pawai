<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>My exams | Sanskar Academy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/portal.css}" rel="stylesheet">
</head>
<body class="portal-body">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/portal-nav :: nav(exams)}"></div>
<div class="portal-wrap">
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<h3 class="mb-3">🧠 My Exams</h3>
<div class="row g-4">
  <div class="col-lg-7">
    <div class="soft-card"><div class="card-title-row"><h5>Exams from my teachers</h5></div>
      <div class="card-pad">
        <div class="list-row" th:each="x : ${exams}">
          <div class="flex-grow-1">
            <div class="fw-semibold" th:text="${x.exam.title}"></div>
            <small class="text-muted" th:text="${x.exam.subject.subjectName} + ' · ' + ${x.exam.questions.size()} + ' questions · ' + ${x.exam.totalMarks} + ' marks · ' + ${x.exam.durationMinutes} + ' min'"></small>
            <div class="small text-danger" th:if="${x.exam.dueDate != null and x.state == 'AVAILABLE'}"
                 th:text="'Start before ' + ${#temporals.format(x.exam.dueDate,'dd MMM, HH:mm')}"></div>
          </div>
          <span class="badge me-2" th:classappend="${x.badgeClass}" th:text="${x.stateLabel}"></span>
          <form th:if="${x.state == 'AVAILABLE'}" th:action="@{/student/exams/{id}/start(id=${x.exam.id})}" method="post"
                onsubmit="return confirm('Start now? The timer begins immediately and cannot be paused.');">
            <button class="btn btn-sm btn-primary">Start</button></form>
          <a th:if="${x.state == 'IN_PROGRESS' or x.state == 'DONE'}" class="btn btn-sm btn-outline-primary"
             th:href="@{/student/exams/attempt/{id}(id=${x.attempt.id})}" th:text="${x.state == 'DONE'} ? 'View result' : 'Continue'"></a>
        </div>
        <div class="empty-note" th:if="${#lists.isEmpty(exams)}">No exams yet. Use AI Learn to practise meanwhile 🤖</div>
      </div></div>
  </div>
  <div class="col-lg-5">
    <div class="soft-card"><div class="card-title-row"><h5>My results</h5></div>
      <div class="card-pad">
        <a class="list-row text-decoration-none text-dark" th:each="r : ${results}" th:href="@{/student/exams/attempt/{id}(id=${r.id})}">
          <div class="flex-grow-1"><div class="fw-semibold" th:text="${r.exam.title}"></div>
            <small class="text-muted" th:text="${r.exam.subject.subjectName}"></small></div>
          <span class="badge" th:classappend="${r.badgeClass}" th:text="${r.pending} ? 'Pending' : ${r.percentage} + '% · ' + ${r.grade}"></span>
        </a>
        <div class="empty-note" th:if="${#lists.isEmpty(results)}">No results yet.</div>
      </div></div>
  </div>
</div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
