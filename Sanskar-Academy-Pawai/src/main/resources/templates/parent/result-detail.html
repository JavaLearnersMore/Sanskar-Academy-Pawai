<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Result | Sanskar Academy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/portal.css}" rel="stylesheet">
</head>
<body class="portal-body">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/portal-nav :: nav('results')}"></div>
<div class="portal-wrap">
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<a th:href="@{/parent/results}" class="small">← All results</a>
<div class="mt-2" th:replace="~{fragments/result-parts :: scoreHeader(${attempt})}"></div>
<h5 class="mb-3">Answers submitted</h5>
<div th:replace="~{fragments/result-parts :: answerReview(${attempt})}"></div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
