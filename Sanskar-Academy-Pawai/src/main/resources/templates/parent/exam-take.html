<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Exam | Sanskar Academy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/portal.css}" rel="stylesheet">
</head>
<body class="portal-body">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/portal-nav :: nav(exams)}"></div>
<div class="portal-wrap">
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<div class="timer-bar mb-3">
  <div><b th:text="${exam.title}"></b><div class="small text-muted" th:text="${exam.subject.subjectName} + ' · ' + ${exam.totalMarks} + ' marks'"></div></div>
  <div class="time" id="clock">--:--</div>
</div>
<p class="text-muted" th:if="${exam.description}" th:text="${exam.description}"></p>

<form id="examForm" th:action="@{/student/exams/attempt/{id}/submit(id=${attempt.id})}" method="post">
  <div class="soft-card mb-3" th:each="q, st : ${exam.questions}">
    <div class="card-pad">
      <div class="d-flex justify-content-between">
        <div class="fw-semibold" th:text="${st.count} + '. ' + ${q.questionText}"></div>
        <span class="badge bg-light text-dark border" th:text="${q.marks} + ' mark(s)'"></span></div>
      <div class="mt-3" th:if="${q.type.name() == 'MCQ'}">
        <label class="q-opt" th:each="L : ${ {'A','B','C','D'} }" th:if="${q.optionText(L) != null and !q.optionText(L).isBlank()}">
          <input type="radio" th:name="'q_' + ${q.id}" th:value="${L}"><b th:text="${L} + '.'"></b> <span th:text="${q.optionText(L)}"></span></label>
      </div>
      <div class="mt-3" th:if="${q.type.name() == 'SHORT'}">
        <textarea class="form-control" rows="4" maxlength="2000" th:name="'q_' + ${q.id}" placeholder="Write your answer..."></textarea></div>
    </div>
  </div>
  <button class="btn btn-success btn-lg" onclick="return confirm('Submit your exam now?');">Submit exam</button>
</form>

<script th:inline="javascript">
var remaining = /*[[${attempt.remainingSeconds}]]*/ 600;
var form = document.getElementById('examForm'), clock = document.getElementById('clock'), done = false;
function tick(){
  var m = Math.floor(remaining/60), s = remaining%60;
  clock.textContent = (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  clock.classList.toggle('low', remaining<=60);
  if(remaining<=0 && !done){ done=true; window.onbeforeunload=null; form.submit(); return; }
  remaining--; setTimeout(tick,1000);
}
tick();
form.addEventListener('submit', function(){ done=true; window.onbeforeunload=null; });
window.onbeforeunload = function(){ return 'Your exam is still running.'; };
</script>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
