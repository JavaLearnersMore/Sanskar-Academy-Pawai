<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Leave | Sanskar Academy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/portal.css}" rel="stylesheet">
</head>
<body class="portal-body">

<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/portal-nav :: nav('leave')}"></div>

<div class="portal-wrap">
    <h3 class="mb-3">📝 Student Leave</h3>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row g-4 mb-4">
        <div class="col-lg-4">
            <div class="soft-card"><div class="card-title-row"><h5>Apply for my child</h5></div>
                <div class="card-pad">
                    <div class="empty-note" th:if="${#lists.isEmpty(children)}">No child is linked to your account.</div>
                    <form th:action="@{/parent/leave/apply}" method="post" th:unless="${#lists.isEmpty(children)}">
                        <div class="mb-3"><label class="form-label">Child</label>
                            <select name="studentId" class="form-select" required>
                                <option th:each="c : ${children}" th:value="${c.id}" th:text="${c.fullName}"></option>
                            </select></div>
                        <div class="mb-3"><label class="form-label">From</label>
                            <input type="date" name="fromDate" class="form-control" th:value="${today}" required></div>
                        <div class="mb-3"><label class="form-label">To</label>
                            <input type="date" name="toDate" class="form-control" th:value="${today}" required></div>
                        <div class="mb-3"><label class="form-label">Reason</label>
                            <textarea name="reason" class="form-control" rows="3" maxlength="500" required></textarea></div>
                        <button class="btn btn-primary w-100">Send Request</button>
                    </form>
                </div></div>
        </div>
        <div class="col-lg-8">
            <div class="soft-card"><div class="card-title-row"><h5>Requests</h5></div>
                <div class="card-pad"><div th:replace="~{fragments/leave-parts :: leaveTable(${leaves})}"></div></div></div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
