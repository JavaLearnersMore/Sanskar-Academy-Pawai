<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Something went wrong | Sanskar Academy Classes</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#f4f6fb;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.card{max-width:480px;width:100%;border-radius:15px}</style>
</head>
<body>
<div class="card shadow"><div class="card-body p-4 text-center">
    <div style="font-size:3rem">😕</div>
    <h4>Something went wrong</h4>
    <p class="text-muted" th:text="${errorMessage != null} ? ${errorMessage} : 'Please go back and try again.'"></p>
    <a th:href="@{/dashboard}" class="btn btn-primary">Go to my dashboard</a>
</div></div>
</body>
</html>
