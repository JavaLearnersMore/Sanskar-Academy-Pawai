<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>My Leave | Sanskar Academy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/portal.css}" rel="stylesheet">
    <style> body { background-color: #f4f6f9; } .card { border-radius: 12px; } </style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/portal-nav :: nav('leave')}"></div>
<div class="container py-4" style="max-width:1000px">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${staff == null}" class="alert alert-warning">You are not in the staff list yet. Please ask the admin to add you under <b>Staff</b>.</div>

<div th:if="${staff != null}">
    <h3 class="mb-3">&#128221; My Leave</h3>
    <div class="row g-4">
        <div class="col-lg-4"><div class="card shadow-sm"><div class="card-body">
            <h5>Apply for leave</h5>
            <form th:action="@{/staff/leave/apply}" method="post">
                <div class="mb-2"><label class="form-label">From</label><input type="date" name="fromDate" class="form-control" th:value="${today}" required></div>
                <div class="mb-2"><label class="form-label">To</label><input type="date" name="toDate" class="form-control" th:value="${today}" required></div>
                <div class="mb-3"><label class="form-label">Reason</label><textarea name="reason" class="form-control" rows="3" maxlength="480" required></textarea></div>
                <button class="btn btn-primary w-100">Send to Admin</button>
            </form></div></div></div>
        <div class="col-lg-8"><div class="card shadow-sm"><div class="card-body">
            <h5>My requests</h5>
            <table class="table align-middle"><thead class="table-light"><tr><th>Dates</th><th>Days</th><th>Reason</th><th>Status</th><th></th></tr></thead><tbody>
            <tr th:each="l : ${leaves}">
                <td th:text="${#temporals.format(l.fromDate,'dd MMM')} + ' - ' + ${#temporals.format(l.toDate,'dd MMM yyyy')}"></td>
                <td th:text="${l.days}"></td>
                <td><span th:text="${l.reason}"></span><div class="small text-muted" th:if="${l.adminNote != null}" th:text="'Admin: ' + ${l.adminNote}"></div></td>
                <td><span class="badge" th:classappend="${l.badgeClass}" th:text="${l.status}"></span></td>
                <td><form th:if="${l.status.name() == 'PENDING'}" th:action="@{/staff/leave/{id}/cancel(id=${l.id})}" method="post" class="m-0"><button class="btn btn-sm btn-outline-secondary">Cancel</button></form></td>
            </tr>
            <tr th:if="${#lists.isEmpty(leaves)}"><td colspan="5" class="text-center text-muted py-4">No requests yet</td></tr>
            </tbody></table></div></div></div>
    </div>
</div>

</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
