<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>My Salary | Sanskar Academy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/portal.css}" rel="stylesheet">
    <style> body { background-color: #f4f6f9; } .card { border-radius: 12px; } </style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/portal-nav :: nav('salary')}"></div>
<div class="container py-4" style="max-width:1000px">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${staff == null}" class="alert alert-warning">You are not in the staff list yet. Please ask the admin to add you under <b>Staff</b>.</div>

<div th:if="${staff != null}">
    <h3 class="mb-3">&#128188; My Salary</h3>
    <div class="card shadow-sm"><div class="card-body">
        <table class="table align-middle"><thead class="table-light"><tr><th>Month</th><th>Salary</th><th>Cut</th><th>Net paid</th><th>Status</th><th></th></tr></thead><tbody>
        <tr th:each="p : ${slips}">
            <td th:text="${p.monthName}"></td><td th:text="${p.grossSalary}"></td>
            <td th:text="${p.leaveDeduction.add(p.otherDeduction)}"></td>
            <td class="fw-bold" th:text="${p.status.name() == 'PAID'} ? ${p.netSalary} : '-'"></td>
            <td><span class="badge" th:classappend="${p.status.name() == 'PAID'} ? 'bg-success' : 'bg-secondary'" th:text="${p.status.name() == 'PAID'} ? 'PAID' : 'Being prepared'"></span></td>
            <td><a th:if="${p.status.name() == 'PAID'}" th:href="@{/staff/salary/{id}(id=${p.id})}">View slip</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(slips)}"><td colspan="6" class="text-center text-muted py-4">No salary records yet</td></tr>
        </tbody></table></div></div>
</div>

</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
