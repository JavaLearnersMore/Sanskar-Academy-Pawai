<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Resend verification | Sanskar Academy Classes</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:linear-gradient(135deg,#000428,#004e92);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.card{max-width:420px;width:100%;border-radius:15px}</style>
</head>
<body>
<div class="card shadow-lg"><div class="card-body p-4">
    <h4 class="text-primary text-center">Resend verification email</h4>
    <form th:action="@{/resend-verification}" method="post">
        <label class="form-label mt-3">Your registered email</label>
        <input type="email" name="email" class="form-control" required>
        <button class="btn btn-primary w-100 mt-3">Send link</button>
    </form>
    <div class="text-center mt-3"><a th:href="@{/login}">Back to login</a></div>
</div></div>
</body>
</html>
