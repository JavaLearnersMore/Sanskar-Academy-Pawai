<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admission Enquiry | Sanskar Academy Classes</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f4f6f9">
<div class="container py-4" style="max-width:640px">
    <h3 class="mb-1">Sanskar Academy Classes</h3>
    <p class="text-muted">Admission enquiry - leave your details and we will call you.</p>
    <div th:if="${done}" class="alert alert-success">Thank you! We have received your enquiry and will contact you soon.</div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <form th:unless="${done}" th:action="@{/enquiry}" method="post" class="card card-body">
        <div class="mb-2"><label class="form-label">Student name *</label><input name="studentName" class="form-control" maxlength="120" required></div>
        <div class="mb-2"><label class="form-label">Parent name</label><input name="parentName" class="form-control" maxlength="120"></div>
        <div class="mb-2"><label class="form-label">Mobile number *</label><input name="phone" class="form-control" maxlength="20" inputmode="tel" required></div>
        <div class="mb-2"><label class="form-label">Email (optional)</label><input name="email" type="email" class="form-control" maxlength="120"></div>
        <div class="mb-2"><label class="form-label">Class</label><input name="interestedClass" class="form-control" maxlength="60" placeholder="e.g. 8th"></div>
        <div class="mb-3"><label class="form-label">Message</label><textarea name="message" class="form-control" rows="3" maxlength="500"></textarea></div>
        <div style="position:absolute;left:-5000px" aria-hidden="true"><label>Website <input name="website" tabindex="-1" autocomplete="off"></label></div>
        <button class="btn btn-primary">Send enquiry</button>
    </form>
</div>
</body>
</html>
