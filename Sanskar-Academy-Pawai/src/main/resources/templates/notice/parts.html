<div th:fragment="content">
    <h3 class="mb-3">&#128226; Notice Board</h3>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${canPost}" class="card mb-3 soft-card"><div class="card-body card-pad">
        <h5>Post a notice</h5>
        <form th:action="@{${base + '/notices'}}" method="post" class="row g-2">
            <div class="col-md-8"><label class="form-label small">Title</label><input name="title" class="form-control" maxlength="200" required></div>
            <div class="col-md-4" th:if="${admin}"><label class="form-label small">Send to</label>
                <select name="audience" id="aud" class="form-select" onchange="document.getElementById('clsBox').style.display = this.value === 'CLASS' ? '' : 'none'">
                    <option value="ALL">Everyone</option><option value="STUDENTS">All students</option>
                    <option value="PARENTS">All parents</option><option value="TEACHERS">All teachers &amp; staff</option>
                    <option value="CLASS">One class</option></select></div>
            <input type="hidden" name="audience" value="CLASS" th:unless="${admin}">
            <div class="col-md-4" id="clsBox" th:style="${admin} ? 'display:none' : ''">
                <label class="form-label small">Class</label>
                <select name="classId" class="form-select"><option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.className}"></option></select></div>
            <div class="col-12"><label class="form-label small">Notice</label><textarea name="body" class="form-control" rows="4" maxlength="3000" required></textarea></div>
            <div class="col-md-3"><label class="form-label small">Show until (optional)</label><input type="date" name="expiresOn" class="form-control"></div>
            <div class="col-md-3 d-flex align-items-end" th:if="${admin}"><div class="form-check"><input class="form-check-input" type="checkbox" name="pinned" value="true" id="pin"><label class="form-check-label" for="pin">Pin on top</label></div></div>
            <div class="col-md-3 d-flex align-items-end"><button class="btn btn-primary">Post notice</button></div>
        </form>
    </div></div>

    <div th:if="${#lists.isEmpty(rows)}" class="card soft-card"><div class="card-body card-pad text-muted">No notices.</div></div>
    <div class="card mb-3 soft-card" th:each="r : ${rows}" th:classappend="${!r.read} ? 'border-primary'"><div class="card-body card-pad">
        <div class="d-flex justify-content-between flex-wrap gap-2">
            <div>
                <span class="badge bg-warning text-dark" th:if="${r.notice.pinned}">&#128204; Pinned</span>
                <span class="badge bg-primary" th:if="${!r.read}">NEW</span>
                <b class="ms-1" th:text="${r.notice.title}"></b>
            </div>
            <span class="small text-muted" th:text="${#temporals.format(r.notice.postedAt, 'dd MMM yyyy, HH:mm') + ' - ' + r.notice.postedBy.fullName}"></span>
        </div>
        <div class="small text-muted" th:text="${'To: ' + r.audienceLabel + (r.notice.expiresOn != null ? ' | until ' + r.notice.expiresOn : '')}"></div>
        <p class="mt-2 mb-1" style="white-space:pre-wrap" th:text="${r.notice.body}"></p>
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2" th:if="${r.audienceSize > 0}">
            <span class="small" th:text="${'Read by ' + r.readCount + ' of ' + r.audienceSize}"></span>
            <a th:if="${admin}" class="small" th:href="@{'/admin/notices/' + ${r.notice.id} + '/unread'}">Who has not read it?</a>
        </div>
        <form th:if="${canPost}" th:action="@{${base + '/notices/' + r.notice.id + '/delete'}}" method="post" class="mt-2" onsubmit="return confirm('Delete this notice?')">
            <button class="btn btn-sm btn-outline-danger">Delete</button></form>
    </div></div>
</div>
