<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Not read yet | Sanskar Academy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/portal.css}" rel="stylesheet">
    <style>body { background-color: #f4f6f9; } .card { border-radius: 12px; }</style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container-fluid"><div class="row">
<div class="col-md-2 p-0"><div th:replace="~{fragments/sidebar :: sidebar}"></div></div>
<div class="col-md-10 p-4">
    <a th:href="@{/admin/notices}" class="btn btn-sm btn-outline-secondary mb-2">&larr; Notice board</a>
    <h3>Not read yet</h3>
    <div class="card"><div class="card-body">
        <div th:if="${#lists.isEmpty(people)}" class="text-success">Everyone has read this notice.</div>
        <table class="table table-sm mb-0" th:unless="${#lists.isEmpty(people)}">
            <thead><tr><th>Name</th><th>Role</th><th>Mobile</th></tr></thead>
            <tbody><tr th:each="u : ${people}"><td th:text="${u.fullName}"></td><td th:text="${u.role != null ? u.role.name : ''}"></td><td th:text="${u.mobileNumber}"></td></tr></tbody>
        </table>
    </div></div>
</div></div></div>
</body>
</html>
