<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Notice Board | Sanskar Academy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/portal.css}" rel="stylesheet">
    <style>body.admin-body { background-color: #f4f6f9; } .soft-card { border-radius: 12px; }</style>
</head>
<body th:class="${admin} ? 'admin-body' : 'portal-body'">
<div th:replace="~{fragments/header :: header}"></div>
<th:block th:if="${admin}">
    <div class="container-fluid"><div class="row">
        <div class="col-md-2 p-0"><div th:replace="~{fragments/sidebar :: sidebar}"></div></div>
        <div class="col-md-10 p-4"><div th:replace="~{notice/parts :: content}"></div></div>
    </div></div>
</th:block>
<th:block th:unless="${admin}">
    <div th:replace="~{fragments/portal-nav :: nav('notices')}"></div>
    <div class="portal-wrap"><div th:replace="~{notice/parts :: content}"></div></div>
</th:block>
</body>
</html>
