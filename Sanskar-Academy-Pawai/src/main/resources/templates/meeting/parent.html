<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Meet a Teacher | Sanskar Academy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/portal.css}" rel="stylesheet">
</head>
<body class="portal-body">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/portal-nav :: nav('meetings')}"></div>
<div class="portal-wrap">
    <h3 class="mb-3">&#129309; Meet a Teacher</h3>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div class="soft-card mb-3"><div class="card-pad">
        <h5>Book a time</h5>
        <div th:if="${#lists.isEmpty(children)}" class="text-muted">No child is linked to your account.</div>
        <div th:if="${#lists.isEmpty(open) and !#lists.isEmpty(children)}" class="text-muted">No open slots right now. Teachers open slots before parent-teacher meetings.</div>
        <div th:each="t : ${open}" class="mb-3">
            <b th:text="${t.teacher.fullName}"></b>
            <div class="table-responsive"><table class="table table-sm align-middle mb-0">
                <tbody><tr th:each="s : ${t.slots}">
                    <td class="text-nowrap" th:text="${#temporals.format(s.startAt, 'EEE dd MMM, hh:mm a')}"></td>
                    <td th:text="${s.mode}"></td>
                    <td>
                        <form th:action="@{'/parent/meetings/' + ${s.id} + '/book'}" method="post" class="d-flex gap-1 flex-wrap">
                            <select name="studentId" class="form-select form-select-sm" style="width:160px"><option th:each="k : ${children}" th:value="${k.id}" th:text="${k.fullName}"></option></select>
                            <input name="purpose" class="form-control form-control-sm" style="width:220px" placeholder="What do you want to discuss?" maxlength="250">
                            <button class="btn btn-sm btn-primary">Book</button>
                        </form></td>
                </tr></tbody></table></div>
        </div>
    </div></div>
    <div class="soft-card"><div class="card-pad">
        <h5>My bookings</h5>
        <div th:if="${#lists.isEmpty(mine)}" class="text-muted">No bookings yet.</div>
        <table class="table table-sm align-middle" th:unless="${#lists.isEmpty(mine)}">
            <tbody><tr th:each="s : ${mine}">
                <td class="text-nowrap" th:text="${#temporals.format(s.startAt, 'EEE dd MMM, hh:mm a')}"></td>
                <td th:text="${s.teacher.fullName}"></td>
                <td th:text="${s.student != null ? s.student.fullName : ''}"></td>
                <td><span class="badge" th:classappend="${s.status.name() == 'CONFIRMED'} ? 'bg-success' : (${s.status.name() == 'BOOKED'} ? 'bg-warning text-dark' : 'bg-secondary')" th:text="${s.status}"></span>
                    <div class="small text-muted" th:if="${s.teacherNote}" th:text="${s.teacherNote}"></div></td>
                <td class="text-end"><form th:if="${(s.status.name() == 'BOOKED' or s.status.name() == 'CONFIRMED') and s.startAt.isAfter(now)}" th:action="@{'/parent/meetings/' + ${s.id} + '/cancel'}" method="post" onsubmit="return confirm('Cancel this booking?')"><button class="btn btn-sm btn-outline-danger">Cancel</button></form></td>
            </tr></tbody>
        </table>
    </div></div>
</div>
</body>
</html>
