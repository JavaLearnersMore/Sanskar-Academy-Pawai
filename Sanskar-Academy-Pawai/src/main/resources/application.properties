# ===============================
# APPLICATION INFO
# ===============================
spring.application.name=Sanskar-Academy-Classes
server.port=${PORT:8080}

# ===============================
# DATASOURCE CONFIG (MySQL 8) - values come from environment variables, never from this file
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sanskar_academy}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# update = Hibernate adds new tables/columns by itself. See application-prod.properties for production.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ===============================
# THYMELEAF CONFIG
# ===============================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ===============================
# ERROR HANDLING (do not show internal details to users)
# ===============================
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# ===============================
# TOTP / 2FA
# ===============================
totp.issuer=SanskarAcademyClasses

# ===============================
# MAIL
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# SPRING AI  (OpenAI-compatible server)
# Free now  : Groq   AI_BASE_URL=https://api.groq.com/openai/v1  AI_MODEL=llama-3.3-70b-versatile
# Paid later: OpenAI AI_BASE_URL=https://api.openai.com/v1       AI_MODEL=gpt-4o-mini
# The address MUST end with /v1 (Spring AI 2.x adds only /chat/completions).
# Only the three environment variables change - no code change.
# Without AI_API_KEY the app still works; only the AI buttons show a message.
# ===============================
spring.ai.openai.api-key=${AI_API_KEY:missing-key}
spring.ai.openai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
spring.ai.openai.chat.options.model=${AI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.4

# ---- separate Notification microservice (leave empty to switch messages off) ----
notification.service.url=${NOTIFICATION_URL:}
notification.service.api-key=${NOTIFICATION_API_KEY:}

# ---- answer-sheet uploads (paper exams) ----
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=100MB
app.upload-dir=${UPLOAD_DIR:uploads}
