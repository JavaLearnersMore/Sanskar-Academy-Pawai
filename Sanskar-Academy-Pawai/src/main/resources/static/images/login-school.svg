<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/><stop offset=".45" stop-color="#ffd8a8"/><stop offset="1" stop-color="#e8f4ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fb760"/><stop offset="1" stop-color="#3a8f43"/></linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#sky)"/>
  <circle cx="470" cy="150" r="70" fill="#fff3c4" opacity=".9"/><circle cx="470" cy="150" r="48" fill="#ffd54f"/>
  <path d="M0 470 Q150 400 300 450 T600 430 V800 H0Z" fill="#8bc98c"/>
  <path d="M0 520 Q200 470 400 510 T600 500 V800 H0Z" fill="url(#grass)"/>

  <!-- school building -->
  <g transform="translate(95 300)">
    <rect x="0" y="110" width="410" height="190" rx="6" fill="#fff4e0" stroke="#d9a35f" stroke-width="3"/>
    <polygon points="-15,115 205,20 425,115" fill="#c0392b"/>
    <rect x="165" y="60" width="80" height="55" fill="#fff4e0" stroke="#d9a35f" stroke-width="3"/>
    <circle cx="205" cy="88" r="16" fill="#fff" stroke="#00509E" stroke-width="4"/>
    <path d="M205 88 V78 M205 88 L212 92" stroke="#00509E" stroke-width="3" stroke-linecap="round"/>
    <rect x="165" y="190" width="80" height="110" rx="6" fill="#00509E"/>
    <line x1="205" y1="190" x2="205" y2="300" stroke="#fff" stroke-width="3"/>
    <g fill="#9ad0f5" stroke="#00509E" stroke-width="3">
      <rect x="25" y="150" width="70" height="60"/><rect x="25" y="230" width="70" height="55" opacity="0"/>
      <rect x="315" y="150" width="70" height="60"/>
      <rect x="95" y="150" width="0" height="0"/>
    </g>
    <g stroke="#00509E" stroke-width="2"><line x1="60" y1="150" x2="60" y2="210"/><line x1="25" y1="180" x2="95" y2="180"/><line x1="350" y1="150" x2="350" y2="210"/><line x1="315" y1="180" x2="385" y2="180"/></g>
    <g fill="#9ad0f5" stroke="#00509E" stroke-width="3"><rect x="105" y="215" width="45" height="50"/><rect x="260" y="215" width="45" height="50"/></g>
    <!-- flag -->
    <line x1="205" y1="20" x2="205" y2="-50" stroke="#555" stroke-width="4"/>
    <path d="M205 -50 h55 v14 h-55z" fill="#ff9933"/><path d="M205 -36 h55 v14 h-55z" fill="#fff"/><path d="M205 -22 h55 v14 h-55z" fill="#138808"/>
    <circle cx="232.500" cy="-29" r="5" fill="none" stroke="#000080" stroke-width="1.500"/>
  </g>

  <!-- trees -->
  <g><rect x="38" y="470" width="14" height="80" fill="#8d5a2b"/><circle cx="45" cy="450" r="48" fill="#2e8b57"/><circle cx="20" cy="475" r="30" fill="#3aa56a"/>
     <rect x="550" y="480" width="14" height="75" fill="#8d5a2b"/><circle cx="557" cy="458" r="44" fill="#2e8b57"/><circle cx="580" cy="482" r="28" fill="#3aa56a"/></g>

  <!-- path -->
  <path d="M255 600 L345 600 L420 800 L180 800Z" fill="#e7c89a"/>

  <!-- children (white shirt, navy bottoms, school bags) -->
  <g>
    <g transform="translate(170 640)"><circle cx="0" cy="0" r="20" fill="#8d5a3b"/><path d="M-20 -6 Q0 -30 20 -6 Q8 -12 -20 -6Z" fill="#222"/>
      <rect x="-20" y="20" width="40" height="55" rx="10" fill="#fff" stroke="#ccd6e0" stroke-width="2"/><rect x="-20" y="68" width="18" height="52" rx="6" fill="#1b3a6b"/><rect x="2" y="68" width="18" height="52" rx="6" fill="#1b3a6b"/>
      <rect x="-30" y="28" width="12" height="40" rx="5" fill="#e74c3c"/></g>
    <g transform="translate(300 665)"><circle cx="0" cy="0" r="20" fill="#a56a45"/><path d="M-21 -2 Q0 -32 21 -2 Q10 -14 -21 -2Z" fill="#1a1a1a"/>
      <rect x="-20" y="20" width="40" height="55" rx="10" fill="#fff" stroke="#ccd6e0" stroke-width="2"/><path d="M-20 62 H20 V72 L26 118 H-26 L-20 72Z" fill="#1b3a6b"/>
      <circle cx="-9" cy="-2" r="2.500" fill="#222"/><circle cx="9" cy="-2" r="2.500" fill="#222"/></g>
    <g transform="translate(425 645)"><circle cx="0" cy="0" r="20" fill="#9a6a47"/><path d="M-20 -4 Q0 -30 20 -4 Q8 -12 -20 -4Z" fill="#222"/>
      <rect x="-20" y="20" width="40" height="55" rx="10" fill="#fff" stroke="#ccd6e0" stroke-width="2"/><rect x="-20" y="68" width="18" height="52" rx="6" fill="#1b3a6b"/><rect x="2" y="68" width="18" height="52" rx="6" fill="#1b3a6b"/>
      <rect x="18" y="28" width="12" height="40" rx="5" fill="#f1c40f"/></g>
  </g>
  <!-- books -->
  <g transform="translate(60 720)"><rect width="70" height="14" rx="3" fill="#00509E"/><rect y="-14" width="62" height="14" rx="3" fill="#ffc107"/><rect y="-28" width="66" height="14" rx="3" fill="#e74c3c"/></g>
</svg>
