# Start with:  --spring.profiles.active=prod   (or environment variable SPRING_PROFILES_ACTIVE=prod)

# Do not let Hibernate change the database in production. Create/alter tables with the SQL in /database
# (the first time you can run once with DDL_AUTO=update, then switch back to validate).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false

spring.thymeleaf.cache=true

# Cookies: only over HTTPS, not readable by JavaScript
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# behind nginx / a load balancer
server.forward-headers-strategy=framework

# connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

server.compression.enabled=true
logging.level.root=INFO
logging.level.com.sanskaracademy=INFO
